<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VH8EELBQ45"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VH8EELBQ45');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qiskit Fall Fest GDL 2026</title>
    <link rel="icon" type="image/svg+xml" href="assets/qiskit_white.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(105, 41, 196, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }
        
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #6929c4, #1192e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .coming-soon {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            opacity: 0.8;
        }
        
        .logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            margin-top: auto;
            padding: 2rem 0;
            flex-wrap: wrap;
        }
        
        .logos img {
            height: 60px;
            width: auto;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        
        .logos img:hover {
            transform: scale(1.1);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .coming-soon {
                font-size: 1.5rem;
                letter-spacing: 0.2rem;
            }
            
            .logos {
                gap: 2rem;
            }
            
            .logos img {
                height: 45px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .coming-soon {
                font-size: 1.2rem;
                letter-spacing: 0.15rem;
            }
            
            .logos {
                gap: 1.5rem;
            }
            
            .logos img {
                height: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Qiskit Fall Fest GDL 2026</h1>
        <p class="coming-soon">Coming Soon</p>
    </div>
    
    <div class="logos">
        <img src="assets/IBM_Quantum_logotype_rev_RGB.png" alt="IBM Quantum">
        <img src="assets/qiskit_white.svg" alt="Qiskit">
    </div>
</body>
</html>
