<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qiskit Fall Fest GDL 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #6929c4, #1192e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .coming-soon {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            opacity: 0.8;
        }
        
        .logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            margin-top: auto;
            padding: 2rem 0;
            flex-wrap: wrap;
        }
        
        .logos img {
            height: 60px;
            width: auto;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        
        .logos img:hover {
            transform: scale(1.1);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .coming-soon {
                font-size: 1.5rem;
                letter-spacing: 0.2rem;
            }
            
            .logos {
                gap: 2rem;
            }
            
            .logos img {
                height: 45px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            
            .coming-soon {
                font-size: 1.2rem;
                letter-spacing: 0.15rem;
            }
            
            .logos {
                gap: 1.5rem;
            }
            
            .logos img {
                height: 35px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Qiskit Fall Fest GDL 2026</h1>
        <p class="coming-soon">Coming Soon</p>
    </div>
    
    <div class="logos">
        <img src="assets/IBM_Quantum_logotype_rev_RGB.png" alt="IBM Quantum">
        <img src="assets/qiskit_white.svg" alt="Qiskit">
    </div>
</body>
</html>
